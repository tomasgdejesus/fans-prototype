name: fans

services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: fans
      POSTGRES_PASSWORD: fans_local
      POSTGRES_DB: fans
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fans -d fans"]
      interval: 2s
      timeout: 3s
      retries: 15

volumes:
  postgres_data:
