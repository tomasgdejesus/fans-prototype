; Local development only. Hosted environments supply their own pooled endpoint.
[databases]
; Set the backend timeout once per pooled server connection, not in client startup
; parameters or through session SET commands. Direct migration connections bypass it.
fans = host=postgres port=5432 dbname=fans connect_query='SET statement_timeout TO 10000'

[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 5432
unix_socket_dir = /tmp
auth_type = scram-sha-256
auth_file = /etc/pgbouncer/userlist.txt
pool_mode = transaction

; Local connection budgets, not production sizing recommendations.
max_client_conn = 100
default_pool_size = 10
max_db_connections = 10
reserve_pool_size = 0
max_prepared_statements = 100
server_connect_timeout = 5
query_wait_timeout = 5
; Fallback slightly above PostgreSQL's 10-second statement timeout.
query_timeout = 12

; Read-only inspection via the pgbouncer virtual database.
stats_users = fans

; Both ports are published to loopback; these credentials/TLS settings are local only.
client_tls_sslmode = disable
server_tls_sslmode = disable
